################################
env_suite: simplerenv
env_name: SimplerEnvImage

obs_dim: 32  # PI0 state dimension
cond_steps: 1
img_cond_steps: 1

action_dim: 7
horizon_steps: 50
act_steps: 10
################################
defaults:
  - _self_
hydra:
  run:
    dir: ${logdir}
_target_: agent.finetune.reinflow.train_ppo_pi0_agent.TrainPPOPi0Agent
name: ${env_name}_ft_pi0_img_ta${horizon_steps}_td${denoising_steps}_tdf${ft_denoising_steps}_seed${seed}
logdir: ${oc.env:REINFLOW_LOG_DIR}/simplerenv/finetune/${env_name}_ft_pi0_img_ta${horizon_steps}_td${denoising_steps}_tdf${ft_denoising_steps}/${now:%Y-%m-%d}_${now:%H-%M-%S}_${seed}
# google_robot -> weights/openpi/openpi0-fractal-torch
# widowx -> weights/openpi/openpi0-bridge-torch
pi0_policy_path: weights/openpi/openpi0-fractal-torch  # Path to pre-trained PI0 checkpoint
scene_name: google_pick_coke_can_1_v4 # bridge_table_1_v2 | google_pick_coke_can_1_v4
robot_type: google_robot # widowx | google_robot

seed: 42
device: cuda:0
#########################
denoising_steps: 10
ft_denoising_steps: 10
min_std: 0.08 # 0.08
max_std: 0.16 # 0.16
#########################

env:
  n_envs: 1 # 50
  name: ${env_name}
  best_reward_threshold_for_success: 1
  max_episode_steps: 300
  save_video: false
  use_image_obs: true
  wrappers:
    simplerenv_image:
      scene_name: ${scene_name}
      robot_type: ${robot_type}
      robot_variant: bridge_dataset  # Use bridge_dataset variant for WidowX
      enable_random_scene: true
      control_freq: 3
      sim_freq: 513
      max_episode_steps: ${env.max_episode_steps}
      shape_meta: ${shape_meta}
    multi_step:
      n_obs_steps: ${cond_steps}
      n_action_steps: ${act_steps}
      max_episode_steps: ${env.max_episode_steps}
      reset_within_step: true

shape_meta:
  obs:
    rgb:
      shape: [3, 224, 224]
    tokenized_prompt:
      shape: [512]  # Max instruction length
    tokenized_prompt_mask:
      shape: [512]  # Max instruction length
    state:
      shape: [8]   # PI0 state dimension
  action:
    shape: [7]

wandb:
  use_wandb: false
  entity: ${oc.env:REINFLOW_WANDB_ENTITY}
  project: robomimic-${env_name}-finetune
  run: ${now:%Y-%m-%d}_${now:%H-%M-%S}_${name}
  offline_mode: false
train:
  n_train_itr: 151
  n_critic_warmup_itr: 2
  n_steps: 300
  gamma: 0.999
  augment: true
  grad_accumulate: 15
  actor_lr: 2e-5
  actor_weight_decay: 0
  actor_lr_scheduler:
    type: cosine
    first_cycle_steps: 100
    warmup_steps: 10
    min_lr: 1e-5
  critic_lr: 6.5e-4
  critic_weight_decay: 0
  critic_lr_scheduler:
    type: cosine
    first_cycle_steps: 100
    warmup_steps: 10
    min_lr: 3e-4
  save_model_freq: 100
  val_freq: 10
  render:
    freq: 1
    num: 0
  # PPO specific
  reward_scale_running: true
  reward_scale_const: 1.0
  gae_lambda: 0.95
  batch_size: 500
  logprob_batch_size: 500
  update_epochs: 10
  vf_coef: 0.5
  target_kl: 1e-2
  lr_schedule: fixed
  repeat_samples: true
  verbose: false
  clip_intermediate_actions: true
  account_for_initial_stochasticity: true
model:
  _target_: model.flow.ft_ppo.ppopi0.PPOPi0
  device: ${device}
  pi0_policy_path: ${pi0_policy_path}
  pi0_config:
    # PI0 configuration
    pytorch_training_precision: "float32"
    model:
      action_dim: 32
      action_horizon: 50
      max_token_len: 512
      paligemma_variant: "gemma_2b"
      action_expert_variant: "gemma_300m"
      pi05: false
  critic:
    _target_: model.common.critic.ViTCritic
    spatial_emb: 128
    augment: false
    backbone:
      _target_: model.common.vit.VitEncoder
      obs_shape: ${shape_meta.obs.rgb.shape}
      num_channel: ${eval:'3 * ${img_cond_steps}'} # each image patch is history concatenated
      img_h: ${shape_meta.obs.rgb.shape[1]}
      img_w: ${shape_meta.obs.rgb.shape[2]}
      cfg:
        patch_size: 8
        depth: 1
        embed_dim: 128
        num_heads: 4
        embed_style: embed2
        embed_norm: 0
    img_cond_steps: ${img_cond_steps}
    mlp_dims: [256, 256, 256]
    activation_type: Mish
    residual_style: true
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
  act_dim: ${action_dim}
  horizon_steps: ${horizon_steps}
  act_min: -1
  act_max: 1
  obs_dim: ${obs_dim}
  cond_steps: ${cond_steps}
  noise_scheduler_type: learn
  inference_steps: ${denoising_steps}
  ft_denoising_steps: ${ft_denoising_steps}
  randn_clip_value: 3
  min_sampling_denoising_std: ${min_std}
  min_logprob_denoising_std: ${min_std}
  max_logprob_denoising_std: ${max_std}
  logprob_min: -1.0
  logprob_max: 1.0
  ################################################
  clip_ploss_coef: 0.01                   # same as DPPO
  clip_ploss_coef_base: 0.001             # changed from 0.01 to 0.001
  clip_ploss_coef_rate: 3                 # same as DPPO
  clip_vloss_coef: null
  denoised_clip_value: 1.0
  ################################################
  time_dim_explore: 32
  learn_explore_time_embedding: true
  use_time_independent_noise: false
  noise_hidden_dims: [256, 256, 256]
  logprob_debug_sample: false
  logprob_debug_recalculate: false
  explore_net_activation_type: Tanh
  pooling_mode: "cls"  # PI0 specific pooling mode
